[project]
name = "atlas"
version = "0.3.0"
description = "ATLAS — private, local-first data engineering AI for schema profiling, quality checks, and reviewed SQL."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ATLAS" }]
keywords = ["data-quality", "duckdb", "fastapi", "profiling"]
dependencies = [
  "duckdb>=1.1.3",
  "fastapi>=0.115.0",
  "polars>=1.17.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
model = [
  "llama-cpp-python>=0.3.4",
]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.uv]
package = true
